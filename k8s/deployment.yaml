apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-model-explorer
  labels:
    app: ai-model-explorer

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ai-model-explorer

  template:
    metadata:
      labels:
        app: ai-model-explorer

    spec:
      containers:
        - name: ai-model-explorer
          image: host.minikube.internal:5001/ai-model-explorer:8
          imagePullPolicy: Always

          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter-secret
                  key: OPENROUTER_API_KEY

            - name: OPENROUTER_BASE_URL
              value: https://openrouter.ai/api/v1

          ports:
            - containerPort: 5000
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"